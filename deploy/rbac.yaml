apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8sqlite
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8sqlite
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8sqlite
subjects:
  - kind: ServiceAccount
    name: k8sqlite
    namespace: default
roleRef:
  kind: ClusterRole
  name: k8sqlite
  apiGroup: rbac.authorization.k8s.io
