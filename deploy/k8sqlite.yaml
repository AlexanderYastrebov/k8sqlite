apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8sqlite
  labels:
    app: k8sqlite
spec:
  replicas: 2
  selector:
    matchLabels:
      deployment: k8sqlite
  template:
    metadata:
      labels:
        app: k8sqlite
        deployment: k8sqlite
    spec:
      serviceAccountName: k8sqlite
      containers:
        - name: k8sqlite
          image: ghcr.io/alexanderyastrebov/k8sqlite:latest
          ports:
            - containerPort: 5351
          readinessProbe:
            httpGet:
              path: /ready
              port: 5351
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: k8sqlite
spec:
  selector:
    deployment: k8sqlite
  ports:
    - protocol: TCP
      port: 5351
      targetPort: 5351
